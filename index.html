<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أنس الحاسي | Anas Al-Hasy</title>
<meta name="theme-color" content="#14110E">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#14110E;--surface:#1D1914;--line:#342F28;--ink:#F6F1E8;--muted:#A89F92;--sun:#F08A24;--sun-ink:#14110E;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14110E;--surface:#1D1914;--line:#342F28;--ink:#F6F1E8;--muted:#A89F92}}
:root[data-theme="dark"]{--bg:#14110E}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.7 "Readex Pro",system-ui,"Segoe UI",Tahoma,sans-serif;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
a{color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:0 20px}
.hero .wrap{position:relative;z-index:1}
.hero{position:relative;padding:20px 0 40px;text-align:center;overflow:hidden;background:radial-gradient(120% 70% at 85% 0%,rgba(240,138,36,.22),transparent 60%)}
.top{display:flex;justify-content:flex-end}
.lang{background:none;border:1px solid var(--line);color:var(--ink);font:inherit;font-size:14px;padding:6px 16px;border-radius:99px;cursor:pointer}
.lang:focus-visible,.btn:focus-visible,summary:focus-visible,.soc a:focus-visible{outline:2px solid var(--sun);outline-offset:3px}
.logo{display:block;width:min(78%,360px);height:auto;margin:36px auto 18px}
.role{font-size:19px;font-weight:600;margin:0}
.tag{color:var(--muted);margin:6px 0 26px;font-weight:300}
.btn{display:inline-block;background:var(--sun);color:var(--sun-ink);font-weight:700;text-decoration:none;padding:13px 28px;border-radius:12px}
.soc{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:22px}
.soc a{text-decoration:none;font-size:14px;color:var(--muted);border:1px solid var(--line);padding:6px 16px;border-radius:99px}
.soc a:hover{color:var(--ink);border-color:var(--muted)}
section{padding:34px 0 6px}
h2{font-size:24px;line-height:1.3;margin:0 0 14px;font-weight:700}
p{margin:0 0 12px}
#about{white-space:pre-line;margin-top:14px}#about[hidden]{display:none}
.acc{display:flex;justify-content:space-between;align-items:center;width:100%;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:14px 18px;font:inherit;font-size:20px;font-weight:700;cursor:pointer}
.acc::after{content:"+";font-size:26px;font-weight:300;color:var(--sun);transition:transform .2s}
.acc[aria-expanded=true]::after{transform:rotate(45deg)}
.acc:focus-visible{outline:2px solid var(--sun);outline-offset:3px}
.muted{color:var(--muted);font-size:14px}
.pkg{display:grid;grid-template-columns:1fr auto;gap:2px 16px;padding:18px 0;border-top:1px solid var(--line)}
.pkg:last-of-type{border-bottom:1px solid var(--line)}
.pkg h3{margin:0;font-size:18px;font-weight:600}
.pkg .d{color:var(--muted);font-size:14px;grid-column:1}
.pr{grid-row:1/span 2;grid-column:2;align-self:center;text-align:end;font-size:26px;font-weight:700;color:var(--sun);line-height:1.1}
.pr small{display:block;font-size:12px;font-weight:300;color:var(--muted)}
details{border-top:1px solid var(--line)}
details:last-of-type{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:18px 0;font-size:18px;font-weight:600}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:26px;font-weight:300;color:var(--sun);transition:transform .2s}
details[open] summary::after{transform:rotate(45deg)}
.it{display:grid;grid-template-columns:1fr auto;gap:2px 16px;padding:12px 0 14px;border-top:1px dashed var(--line)}
.it b{font-weight:600}
.it .v{font-weight:700;color:var(--sun);text-align:end;white-space:nowrap}
.it .d{grid-column:1/-1;color:var(--muted);font-size:14px}
.cta{margin-top:34px;padding:28px 22px;background:var(--surface);border-radius:16px;text-align:center}
.cta h2{margin-bottom:8px}
.cta .soc{margin-top:14px}
footer{text-align:center;color:var(--muted);font-size:13px;padding:30px 0 10px}
.bar{position:fixed;inset:auto 0 0 0;background:rgba(20,17,14,.92);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px))}
.bar .btn{display:block;max-width:600px;margin:0 auto;text-align:center}
#req{scroll-margin-top:12px}
.fld{margin:0 0 14px}.fld label{display:block;font-size:14px;color:var(--muted);margin:0 0 6px}
.fld select,.fld input,.fld textarea{width:100%;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;font-size:16px}
.fld textarea{min-height:110px;resize:vertical}
.fld select:focus-visible,.fld input:focus-visible,.fld textarea:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.fld select:disabled{opacity:.5}
.note{background:var(--surface);border:1px solid var(--sun);border-radius:12px;padding:12px 14px;font-size:14px;margin:0 0 18px}
.err{color:#ff8a6b;font-size:14px;min-height:22px;margin:0 0 8px}
button.btn{border:0;font:inherit;font-weight:700;cursor:pointer;width:100%}
.tabs{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:6px;padding:10px 8px;background:rgba(20,17,14,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tabsIn{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none}
.tab{white-space:nowrap;color:var(--muted);text-decoration:none;font-size:13px;padding:8px 6px;border-radius:99px;text-align:center;line-height:1.2}
.tabs .lang{padding:6px 10px;font-size:12px}
.tab:hover{color:var(--ink)}.tab.on{color:var(--sun-ink);background:var(--sun);font-weight:700}
.tab.off{opacity:.6;cursor:not-allowed}.tab.off small{display:block;font-size:10px;color:var(--sun)}
.tab:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.cbtn{display:flex;justify-content:space-between;align-items:center;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:0 0 10px;font-weight:600}
.cbtn.wa{background:var(--sun);color:var(--sun-ink);border-color:var(--sun)}
.cbtn .ci{display:inline-flex;align-items:center;gap:12px}
.cbtn .ci svg{width:22px;height:22px;flex:none}
.cbtn::after{content:"\2190"}html[dir=ltr] .cbtn::after{content:"\2192"}
.cbtn:focus-visible{outline:2px solid var(--sun);outline-offset:3px}
#req{scroll-margin-top:70px}
.bar[hidden]{display:none}
.aboutTop::after{content:"";display:block;clear:both}
.portrait{float:right;width:42%;margin:4px 0 12px 16px}
html[dir=ltr] .portrait{float:left;margin:4px 16px 12px 0}
.aboutTop #about{margin-top:0}
.portrait img,.gal img{display:block;width:100%;height:auto;border-radius:14px;border:1px solid var(--line)}
.portrait img{box-shadow:0 10px 30px rgba(240,138,36,.2)}
.gh{font-size:18px;margin:26px 0 12px}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.gal figure{margin:0}
.gal figcaption{font-size:12px;color:var(--muted);text-align:center;margin-top:6px;line-height:1.4}
@media (min-width:900px){
.wrap{max-width:1180px;padding:0 48px}
.tabs{justify-content:center;gap:14px;padding:12px 48px}
.tabsIn{flex:0 1 auto;gap:8px;overflow:visible}
.tab{font-size:16px;padding:9px 20px}
.tabs .lang{font-size:14px;padding:8px 18px}
.tab.off small{font-size:11px}
.hero{padding:28px 0 64px}
.logo{width:min(40%,440px);margin:28px auto 22px}
.role{font-size:24px}
.tag{font-size:18px;margin:8px 0 32px}
.btn{padding:15px 40px;font-size:17px}
section{padding:48px 0 10px}
h2{font-size:30px;margin-bottom:18px}
#req{max-width:860px;margin-left:auto;margin-right:auto;display:grid;grid-template-columns:1fr 1fr;column-gap:20px;align-items:start}
#req>h2,#req>.note,#req>.err,#req>button,#req>.fld:nth-of-type(5){grid-column:1/-1}
#req>.note{max-width:none}
#monthly{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
#monthly .pkg{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px}
#monthly .pkg:last-of-type{border-bottom:1px solid var(--line)}
#monthly .pr{order:3;text-align:start;margin-top:10px;grid-row:auto;grid-column:auto}
#monthly .pkg .d{order:2}
#prices{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
#prices details{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0 22px}
#prices details:last-of-type{border-bottom:1px solid var(--line)}
.portrait{width:34%;margin:4px 0 16px 32px}
html[dir=ltr] .portrait{margin:4px 32px 16px 0}
#about{font-size:18px;line-height:1.9}
.gal{gap:18px}
.gal figcaption{font-size:14px}
#clist{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cbtn{margin:0;padding:22px 24px;font-size:18px}
.cbtn .ci svg{width:26px;height:26px}
.cta{padding:40px}
.bar .btn{max-width:420px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

hAbout:"من أنا",about:"أنا أنس الحاسي، صانع محتوى تجاري وتسويقي ومخرج سينمائي، بدأت رحلتي في المجال عام 2017، وطورت خلالها خبرتي في التصوير السينمائي، والإخراج، وصناعة الأفكار، والمونتاج.\n\nأؤمن أن المحتوى الناجح لا يعتمد على الصورة الجميلة فقط، بل على فكرة واضحة ورؤية إبداعية تخدم هدف المشروع وتعكس هوية العلامة التجارية.\n\nأعمل على تحويل الأفكار إلى أعمال بصرية مدروسة، تجمع بين الأسلوب السينمائي والتوجه التسويقي، لمختلف الأنشطة التجارية والعلامات التجارية.\n\nهدفي لا يقتصر على إنتاج محتوى لمرة واحدة، بل بناء شراكات إعلامية طويلة الأمد أكون فيها جزءًا من تطور العلامة التجارية وحضورها.",

hAbout:"About",about:"I’m Anas Al-Hasy, a commercial and marketing content creator and cinematic director. I started my journey in the field in 2017, and since then I’ve built my expertise in cinematic filming, directing, idea development and editing.\n\nI believe successful content doesn’t rely on a beautiful image alone, but on a clear idea and a creative vision that serves the project’s goal and reflects the brand’s identity.\n\nI turn ideas into carefully crafted visual work that blends a cinematic style with a marketing mindset, for all kinds of businesses and brands.\n\nMy goal isn’t to produce one-off content, but to build long-term media partnerships where I’m part of the brand’s growth and presence.",
