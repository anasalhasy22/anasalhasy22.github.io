<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أنس الحاسي | Anas Al-Hasy</title>
<meta name="theme-color" content="#14110E">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#14110E;--surface:#1D1914;--line:#342F28;--ink:#F6F1E8;--muted:#A89F92;--sun:#F08A24;--sun-ink:#14110E;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14110E;--surface:#1D1914;--line:#342F28;--ink:#F6F1E8;--muted:#A89F92}}
:root[data-theme="dark"]{--bg:#14110E}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.7 "Readex Pro",system-ui,"Segoe UI",Tahoma,sans-serif;padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
a{color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:0 20px}
.hero{position:relative;padding:20px 0 40px;text-align:center;overflow:hidden;background:radial-gradient(120% 70% at 85% 0%,rgba(240,138,36,.22),transparent 60%)}
.top{display:flex;justify-content:flex-end}
.lang{background:none;border:1px solid var(--line);color:var(--ink);font:inherit;font-size:14px;padding:6px 16px;border-radius:99px;cursor:pointer}
.lang:focus-visible,.btn:focus-visible,summary:focus-visible,.soc a:focus-visible{outline:2px solid var(--sun);outline-offset:3px}
.logo{display:block;width:min(78%,360px);height:auto;margin:36px auto 18px}
.role{font-size:19px;font-weight:600;margin:0}
.tag{color:var(--muted);margin:6px 0 26px;font-weight:300}
.btn{display:inline-block;background:var(--sun);color:var(--sun-ink);font-weight:700;text-decoration:none;padding:13px 28px;border-radius:12px}
.soc{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:22px}
.soc a{text-decoration:none;font-size:14px;color:var(--muted);border:1px solid var(--line);padding:6px 16px;border-radius:99px}
.soc a:hover{color:var(--ink);border-color:var(--muted)}
section{padding:34px 0 6px}
h2{font-size:24px;line-height:1.3;margin:0 0 14px;font-weight:700}
p{margin:0 0 12px}
.muted{color:var(--muted);font-size:14px}
.pkg{display:grid;grid-template-columns:1fr auto;gap:2px 16px;padding:18px 0;border-top:1px solid var(--line)}
.pkg:last-of-type{border-bottom:1px solid var(--line)}
.pkg h3{margin:0;font-size:18px;font-weight:600}
.pkg .d{color:var(--muted);font-size:14px;grid-column:1}
.pr{grid-row:1/span 2;grid-column:2;align-self:center;text-align:end;font-size:26px;font-weight:700;color:var(--sun);line-height:1.1}
.pr small{display:block;font-size:12px;font-weight:300;color:var(--muted)}
details{border-top:1px solid var(--line)}
details:last-of-type{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:18px 0;font-size:18px;font-weight:600}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:26px;font-weight:300;color:var(--sun);transition:transform .2s}
details[open] summary::after{transform:rotate(45deg)}
.it{display:grid;grid-template-columns:1fr auto;gap:2px 16px;padding:12px 0 14px;border-top:1px dashed var(--line)}
.it b{font-weight:600}
.it .v{font-weight:700;color:var(--sun);text-align:end;white-space:nowrap}
.it .d{grid-column:1/-1;color:var(--muted);font-size:14px}
.cta{margin-top:34px;padding:28px 22px;background:var(--surface);border-radius:16px;text-align:center}
.cta h2{margin-bottom:8px}
.cta .soc{margin-top:14px}
footer{text-align:center;color:var(--muted);font-size:13px;padding:30px 0 10px}
.bar{position:fixed;inset:auto 0 0 0;background:rgba(20,17,14,.92);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px))}
.bar .btn{display:block;max-width:600px;margin:0 auto;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
